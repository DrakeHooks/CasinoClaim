name: Docker Build and Push

on:
  push:
    branches: [ main, testing ]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # testing publishes only :testing and an immutable commit tag.
      # main publishes :main (used by production Compose), :latest, and a commit tag.
      - name: Set Docker image tags
        id: vars
        shell: bash
        run: |
          {
            echo "TAGS<<EOF"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "drakehooks/casinoclaim:main"
              echo "drakehooks/casinoclaim:latest"
            elif [[ "${GITHUB_REF_NAME}" == "testing" ]]; then
              echo "drakehooks/casinoclaim:testing"
            else
              echo "Unexpected branch: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            echo "drakehooks/casinoclaim:${GITHUB_SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # If you don't need ARM yet, set to linux/amd64
          platforms: linux/amd64
          tags: ${{ steps.vars.outputs.TAGS }}
          # Optional: cache to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
